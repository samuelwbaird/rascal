# build, test and release rascal when a version tag is pushed, eg.
#   git tag v0.1.0 && git push origin v0.1.0
# the tag must match VERSION in the Makefile
#
# the release has, for each platform, rascal-<version>-<platform>.tar.gz
# (the executable and its LICENSES.txt), rascal-<version>-dependencies.tar
# (every dependency download, for building from source without the network)
# and SHA256SUMS for all of them
#
# the Homebrew formula in https://github.com/samuelwbaird/homebrew-tap is then
# updated to the release, if the HOMEBREW_TAP_TOKEN secret is set to a token
# that can push to that repository

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15            # darwin-arm64
          - runner: macos-15-intel      # darwin-x86_64
          - runner: ubuntu-24.04        # linux-x86_64-static, built in Alpine
            container: true
          - runner: ubuntu-24.04-arm    # linux-aarch64-static, built in Alpine
            container: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        run: test "v$(make -s version)" = "$GITHUB_REF_NAME"

      - name: Build, test and package (macOS)
        if: ${{ !matrix.container }}
        run: make -j4 test release

      - name: Build, test and package (Linux, fully static)
        if: ${{ matrix.container }}
        run: scripts/docker-build.sh alpine all test release

      - uses: actions/upload-artifact@v4
        with:
          name: rascal-${{ matrix.runner }}
          path: dist/*.tar.gz
          if-no-files-found: error

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make dependencies-archive
      - uses: actions/upload-artifact@v4
        with:
          name: rascal-dependencies
          path: dist/*-dependencies.tar
          if-no-files-found: error

  release:
    needs: [build, dependencies]
    runs-on: ubuntu-24.04
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum rascal-* > SHA256SUMS && cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "rascal ${GITHUB_REF_NAME#v}" \
            --generate-notes

      - name: Update the Homebrew tap
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/samuelwbaird/homebrew-tap.git" tap
          mkdir -p tap/Formula
          scripts/homebrew-formula.sh "$version" release/SHA256SUMS > tap/Formula/rascal.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rascal.rb
          # nothing to do if the formula is already up to date, eg. a re-run
          if ! git diff --cached --quiet; then
            git commit -m "rascal $version"
            git push
          fi
