<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>rascal guestbook</title>
	<style>
		body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
		form { display: grid; gap: 0.5rem; margin-bottom: 2rem; }
		input, textarea, button { font: inherit; padding: 0.4rem; }
		.entry { border-top: 1px solid #ddd; padding: 0.5rem 0; }
		.name { font-weight: 600; }
		.time { color: #777; font-size: 0.85em; margin-left: 0.5rem; }
	</style>
</head>
<body>
	<h1>Guestbook</h1>
	<p>Open this page in two windows: entries added in one appear in the other straight away, by long polling.</p>
	<form id="add">
		<input name="name" placeholder="name" required maxlength="40">
		<textarea name="message" placeholder="message" required maxlength="400"></textarea>
		<button>Add</button>
	</form>
	<div id="entries"></div>
	<script>
		const entries = document.getElementById('entries');
		let last = 0;

		function show(entry) {
			const div = document.createElement('div');
			div.className = 'entry';
			const name = document.createElement('span');
			name.className = 'name';
			name.textContent = entry.name;
			const time = document.createElement('span');
			time.className = 'time';
			time.textContent = new Date(entry.time * 1000).toLocaleTimeString();
			const message = document.createElement('div');
			message.textContent = entry.message;
			div.append(name, time, message);
			entries.prepend(div);
			last = Math.max(last, entry.id);
		}

		// fetch entries after the last one, waiting on the server until there are some
		async function poll(wait) {
			try {
				const response = await fetch('/api/entries?after=' + last + (wait ? '&wait=1' : ''));
				(await response.json()).forEach(show);
			} catch (e) {
				await new Promise(resolve => setTimeout(resolve, 2000));
			}
			poll(true);
		}

		document.getElementById('add').addEventListener('submit', async (event) => {
			event.preventDefault();
			const form = event.target;
			await fetch('/api/entries', {
				method: 'POST',
				headers: { 'content-type': 'application/json' },
				body: JSON.stringify({ name: form.name.value, message: form.message.value }),
			});
			form.message.value = '';
		});

		poll(false);
	</script>
</body>
</html>
